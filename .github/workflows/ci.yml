name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smartops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smartops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartops -d smartops"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SMARTOPS_DEBUG: '1'
      DATABASE_URL: postgresql://smartops:ci-only-password@localhost:5432/smartops
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core
